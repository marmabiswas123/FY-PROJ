[project]
name = "news-verification-agent"
version = "0.1.0"
description = "Multi‑agent news discovery, extraction, and cross‑source verification using LangGraph/LangChain"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]
dependencies = [
    # Core orchestration
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    # LLM providers (choose one or more)
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    # Web search & news APIs
    "serpapi>=1.0.0",
    "newsapi-python>=0.2.0",
    "gnews>=0.4.0",
    # RSS / feed parsing
    "feedparser>=6.0.11",
    # HTML → clean text
    "trafilatura>=1.6.0",
    "newspaper3k>=0.2.8",
    # Metadata extraction
    "extruct>=0.13.0",
    "w3lib>=2.1.1",
    # Language detection
    "fasttext>=0.9.2",
    "langdetect>=1.0.9",
    # Deduplication
    "datasketch>=1.6.0",
    # NLP / embeddings
    "spacy>=3.7.0",
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.8.0",
    # Persistence
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0",
    # API layer
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # Observability
    "langsmith>=0.1.0",
    "prometheus-client>=0.19.0",
    "sentry-sdk>=1.45.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "python-dateutil>=2.8.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.0"
mypy = "^1.10.0"
pre-commit = "^3.6.0"
black = "^24.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"